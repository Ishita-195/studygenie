<VirtualHost *:__PORT__>
    DocumentRoot /var/www/html
    DirectoryIndex index.php index.html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve source / secrets / VCS metadata.
    <DirectoryMatch "^/var/www/html/(\.git|python|docker|__pycache__)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "\.(env|py|pyc|sql|bat|md|cnf|conf|sh|dockerfile)$">
        Require all denied
    </FilesMatch>

    # Allow larger uploads through Apache (PHP limits set separately if needed).
    LimitRequestBody 52428800

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
